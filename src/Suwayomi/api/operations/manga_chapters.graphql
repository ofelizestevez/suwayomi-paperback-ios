
mutation MangaChapters($mangaId: Int!) {
  fetchMangaAndChapters(
    input: {
      id: $mangaId
      fetchManga: false
      fetchChapters: true
    }
  ) {
    chapters {
      id
      mangaId
      name
      chapterNumber
      sourceOrder
      uploadDate
      scanlator
    }
    manga {
      source {
        lang
      }
    }
  }
}