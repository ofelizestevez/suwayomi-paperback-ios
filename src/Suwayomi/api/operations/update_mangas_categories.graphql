mutation UpdateMangasCategories($mangaIds: [Int!]!, $patch: UpdateMangaCategoriesPatchInput!) {
	updateMangasCategories(input: { ids: $mangaIds, patch: $patch }) {
		mangas {
			id
			categories {
				nodes {
					id
				}
			}
		}
	}

	updateMangas(input: { ids: $mangaIds, patch: { inLibrary: true } }) {
		mangas {
			id
			inLibrary
		}
	}
}
